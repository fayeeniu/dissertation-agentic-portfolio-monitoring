<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Precision-first identity resolution</title><desc id="figure-description">Of 14 structural company columns, 1 has an exact registry identifier and 14 require human identity review.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#56615e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff7e5"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d18b16" stroke-width="3"/></pattern></defs><rect width="1200" height="720" fill="#fffdf7"/><text x="60.0" y="58.0" font-size="30" font-weight="750" fill="#17211f" text-anchor="start">Precision-first identity resolution</text><text x="60.0" y="88.0" font-size="16" font-weight="400" fill="#56615e" text-anchor="start">Only exact reviewed source identifiers proceed; new and name-only records stop</text><text x="310.0" y="173.0" font-size="16" font-weight="400" fill="#17211f" text-anchor="end">Portfolio company columns</text><rect x="330.0" y="145.0" width="780.0" height="36.0" rx="3" fill="#edf1ef" stroke="none" opacity="1"/><rect x="330.0" y="145.0" width="780.0" height="36.0" rx="3" fill="#006c62" stroke="none" opacity="1"/><text x="1120.0" y="170.0" font-size="15" font-weight="700" fill="#17211f" text-anchor="start">14</text><text x="310.0" y="237.0" font-size="16" font-weight="400" fill="#17211f" text-anchor="end">Exact registry identifiers</text><rect x="330.0" y="209.0" width="780.0" height="36.0" rx="3" fill="#edf1ef" stroke="none" opacity="1"/><rect x="330.0" y="209.0" width="55.7" height="36.0" rx="3" fill="#2f6690" stroke="none" opacity="1"/><text x="395.7" y="234.0" font-size="15" font-weight="700" fill="#17211f" text-anchor="start">1</text><text x="310.0" y="301.0" font-size="16" font-weight="400" fill="#17211f" text-anchor="end">Human-review holds</text><rect x="330.0" y="273.0" width="780.0" height="36.0" rx="3" fill="#edf1ef" stroke="none" opacity="1"/><rect x="330.0" y="273.0" width="780.0" height="36.0" rx="3" fill="#d18b16" stroke="none" opacity="1"/><text x="1120.0" y="298.0" font-size="15" font-weight="700" fill="#17211f" text-anchor="start">14</text><line x1="60.0" y1="665.0" x2="1140.0" y2="665.0" stroke="#c7cec9" stroke-width="1"/><text x="60.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">Source: Supplied workbook structural profile (counts only; no names or values)</text><text x="600.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="middle">Sample: N=14 company columns</text><text x="1140.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="end">Cutoff: 2025-06-30</text></svg>
