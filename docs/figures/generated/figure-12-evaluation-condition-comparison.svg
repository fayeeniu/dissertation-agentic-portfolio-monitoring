<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Controlled D0 condition comparison</title><desc id="figure-description">D0 synthetic evaluation with 14 cases. Single-agent ablation precision 0.45, recall 1.00, verification accuracy 0.57. Multi-agent verification precision 1.00, recall 1.00, verification accuracy 1.00. These are synthetic functional results, not general performance claims.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#56615e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff7e5"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d18b16" stroke-width="3"/></pattern></defs><rect width="1200" height="720" fill="#fffdf7"/><text x="60.0" y="58.0" font-size="30" font-weight="750" fill="#17211f" text-anchor="start">Controlled D0 condition comparison</text><text x="60.0" y="88.0" font-size="16" font-weight="400" fill="#56615e" text-anchor="start">Shared normalization core; independent verification is the declared addition</text><rect x="140.0" y="415.5" width="70.0" height="154.5" rx="3" fill="#006c62" stroke="none" opacity="1"/><text x="175.0" y="403.5" font-size="14" font-weight="700" fill="#17211f" text-anchor="middle">0.45</text><text x="175.0" y="595.0" font-size="13" font-weight="400" fill="#17211f" text-anchor="middle">Precision</text><rect x="235.0" y="230.0" width="70.0" height="340.0" rx="3" fill="#2f6690" stroke="none" opacity="1"/><text x="270.0" y="218.0" font-size="14" font-weight="700" fill="#17211f" text-anchor="middle">1.00</text><text x="270.0" y="595.0" font-size="13" font-weight="400" fill="#17211f" text-anchor="middle">Recall</text><rect x="330.0" y="375.7" width="70.0" height="194.3" rx="3" fill="#d18b16" stroke="none" opacity="1"/><text