<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Approval-gated export states</title><desc id="figure-description">Report states progress from draft to pending review, approved, exporting, and exported.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#56615e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff7e5"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d18b16" stroke-width="3"/></pattern></defs><rect width="1200" height="720" fill="#fffdf7"/><text x="60.0" y="58.0" font-size="30" font-weight="750" fill="#17211f" text-anchor="start">Approval-gated export states</text><text x="60.0" y="88.0" font-size="16" font-weight="400" fill="#56615e" text-anchor="start">Content changes revoke approval and stale browser actions fail</text><line x1="110.0" y1="330.0" x2="1090.0" y2="330.0" stroke="#006c62" stroke-width="4"/><circle cx="110.0" cy="330.0" r="18" fill="#006c62" stroke="#fffdf7" stroke-width="4"/><text x="110.0" y="285.0" font-size="16" font-weight="700" fill="#17211f" text-anchor="middle">Draft</text><text x="110.0" y="337.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><circle cx="355.0" cy="330.0" r="18" fill="#2f6690" stroke="#fffdf7" stroke-width="4"/><text x="355.0" y="400.0" font-size="16" font-weight="700" fill="#17211f" text-anchor="middle">Pending review</text><text x="355.0" y="337.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><circle cx="600.0" cy="330.0" r="18" fill="#d18b16" stroke="#fffdf7" stroke-width="4"/><text x="600.0" y="285.0" font-size="16" font-weight="700" fill="#17211f" text-anchor="middle">Approved</text><text x="600.0" y="337.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><circle cx="845.0" cy="330.0" r="18" fill="#a23b3b" stroke="#fffdf7" stroke-width="4"/><text x="845.0" y="400.0" font-size="16" font-weight="700" fill="#17211f" text-anchor="middle">Exporting</text><text x="845.0" y="337.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><circle cx="1090.0" cy="330.0" r="18" fill="#665191" stroke="#fffdf7" stroke-width="4"/><text x="1090.0" y="285.0" font-size="16" font-weight="700" fill="#17211f" text-anchor="middle">Exported</text><text x="1090.0" y="337.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><line x1="60.0" y1="665.0" x2="1140.0" y2="665.0" stroke="#c7cec9" stroke-width="1"/><text x="60.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">Source: src/portfolio_agent/reporting.py</text><text x="600.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="middle">Sample: 5 report states</text><text x="1140.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="end">Cutoff: 2025-06-30</text></svg>
