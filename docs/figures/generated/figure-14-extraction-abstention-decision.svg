<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">Hierarchical extraction and abstention</title><desc id="figure-description">The extractor searches structured fields, preserves exact locators and sign or scale, checks periods, validates, and abstains when evidence is absent or ambiguous.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#56615e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff7e5"/><line x1="0" y1="0" x2="0" y2="8" stroke="#d18b16" stroke-width="3"/></pattern></defs><rect width="1200" height="720" fill="#fffdf7"/><text x="60.0" y="58.0" font-size="30" font-weight="750" fill="#17211f" text-anchor="start">Hierarchical extraction and abstention</text><text x="60.0" y="88.0" font-size="16" font-weight="400" fill="#56615e" text-anchor="start">Smallest sufficient context first; absent or ambiguous fields return null</text><rect x="60.0" y="150.0" width="235.0" height="92.0" rx="8" fill="#f5fbf9" stroke="#006c62" opacity="1"/><text x="76.0" y="182.0" font-size="17" font-weight="700" fill="#17211f" text-anchor="start">Structured field</text><text x="76.0" y="211.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">JSON / iXBRL</text><rect x="340.0" y="150.0" width="235.0" height="92.0" rx="8" fill="#f5fbf9" stroke="#006c62" opacity="1"/><text x="356.0" y="182.0" font-size="17" font-weight="700" fill="#17211f" text-anchor="start">Exact locator</text><text x="356.0" y="211.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">sign + scale</text><rect x="620.0" y="150.0" width="235.0" height="92.0" rx="8" fill="#f5fbf9" stroke="#006c62" opacity="1"/><text x="636.0" y="182.0" font-size="17" font-weight="700" fill="#17211f" text-anchor="start">Period match?</text><text x="636.0" y="211.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">comparative check</text><rect x="900.0" y="150.0" width="235.0" height="92.0" rx="8" fill="#f5fbf9" stroke="#006c62" opacity="1"/><text x="916.0" y="182.0" font-size="17" font-weight="700" fill="#17211f" text-anchor="start">Validate</text><text x="916.0" y="211.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">schema + span</text><rect x="60.0" y="337.0" width="235.0" height="92.0" rx="8" fill="#f5fbf9" stroke="#006c62" opacity="1"/><text x="76.0" y="369.0" font-size="17" font-weight="700" fill="#17211f" text-anchor="start">Abstain</text><text x="76.0" y="398.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">missing / ambiguous</text><line x1="295.0" y1="196.0" x2="332.0" y2="196.0" stroke="#56615e" stroke-width="2" marker-end="url(#arrow)"/><line x1="575.0" y1="196.0" x2="612.0" y2="196.0" stroke="#56615e" stroke-width="2" marker-end="url(#arrow)"/><line x1="855.0" y1="196.0" x2="892.0" y2="196.0" stroke="#56615e" stroke-width="2" marker-end="url(#arrow)"/><line x1="1017.5" y1="242.0" x2="1017.5" y2="309.0" stroke="#56615e" stroke-width="2" marker-end="url(#arrow)"/><line x1="60.0" y1="665.0" x2="1140.0" y2="665.0" stroke="#c7cec9" stroke-width="1"/><text x="60.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="start">Source: src/portfolio_agent/document_extraction.py</text><text x="600.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="middle">Sample: 5 decision points</text><text x="1140.0" y="692.0" font-size="13" font-weight="400" fill="#56615e" text-anchor="end">Cutoff: 2025-06-30</text></svg>
