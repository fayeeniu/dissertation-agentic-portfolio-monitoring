      .box-tested { fill:#EAF4F8; stroke:#0072B2; stroke-width:1.9; }
      .box-live { fill:#FFF7E5; stroke:#A86700; stroke-width:2; stroke-dasharray:8 5; }
      .box-held { fill:#FBECEF; stroke:#A83443; stroke-width:2; stroke-dasharray:2 5; }
      .box-conflict { fill:#FFF1F1; stroke:#A83443; stroke-width:1.9; }
