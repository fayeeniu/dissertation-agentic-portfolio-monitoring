      .status-neutral { font:700 10.5px Helvetica,Arial,sans-serif; fill:#53646D; }
      .arrow { fill:none; stroke:#617684; stroke-width:2.1; marker-end:url(#arrowhead); }
      .arrow-support { fill:none; stroke:#7E8F98; stroke-width:1.8; stroke-dasharray:5 5; marker-end:url(#arrowhead); }
      .arrow-live { fill:none; stroke:#A86700; stroke-width:2.1; stroke-dasharray:8 5; marker-end:url(#arrowhead-live); }
      .arrow-held { fill:none; stroke:#A83443; stroke-width:2; stroke-dasharray:2 5; marker-end:url(#arrowhead-held); }
      .guard { fill:#ECEFF0; stroke:#687983; stroke-width:1.5; stroke-dasharray:10 5 2 5; }
