<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180"
     role="img" aria-labelledby="sys-f3-title sys-f3-desc">
  <title id="sys-f3-title">Legal-identity intake and decision flow</title>
  <desc id="sys-f3-desc">A status-coded flow starts with either a portfolio file import or a Companies House-number-only company case. Both paths create checksum- or fingerprint-bound intake records and reuse identical submissions. Exact Companies House numbers, names, domains and documents become separate identity claims. Only an exact, structurally normalised number can enter the named legal-identity decision gate; names only order candidates, domains remain separately reviewed links, and documents remain untrusted local evidence. Named decisions produce resolved, conflicted or unresolved outcomes, with no fuzzy or name-only automatic merge. Downstream public-web company research is available only to a public, identity-ready case with a resolved company and reviewed Companies House number. That research path is implemented but has no completed live run. Direct live Companies House registry retrieval remains held, while synthetic replay is implementation evidence only. The figure does not claim authoritative live resolution, perfect deduplication, an external identity API, or production concurrency.</desc>
  <defs>
    <style><![CDATA[
