780.312px; text-align: center;"><span class="nodeLabel"><p><b>Controls across every stage</b><br />Saved tasks in order · limited retries and use · recovery records<br />named approval before export</p></span></div></foreignObject></g></g><g class="node fx-stage flowchart-label" id="my-svg-D" transform="translate(191.578125, 0)"><rect class="basic label-container" style="" rx="0" ry="0" x="-191.578125" y="-176" width="383.15625" height="352"/><g class="label" style="" transform="translate(-163.578125, -162)"><rect/><foreignObject width="327.15625" height="324"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 383.156px; text-align: center;"><span class="nodeLabel"><p><b>1 · DISCOVER</b><br /><br /><b>Input:</b> reviewed company number,<br />cut-off and category plan<br /><br /><b>Source check:</b> public HTTPS addresses<br />returned in the source list; snippets<br />and model text are not evidence<br /><br /><b>Saved output:</b> possible source list<br />and usage; uncovered categories<br />remain visible</p></span></div></foreignObject></g></g><g class="node fx-stage flowchart-label" id="my-svg-C" transform="translate(588.734375, 0)"><rect class="basic label-container" style="" rx="0" ry="0" x="-191.578125" y="-176" width="383.15625" height="352"/><g class="label" style="" transform="translate(-156.578125, -162)"><rect/><foreignObject width="313.15625" height="324"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 383.156px; text-align: center;"><span class="nodeLabel"><p><b>2 · CAPTURE</b><br /><br /><b>Input:</b> possible source address<br />and fixed response limits<br /><br /><b>Network check:</b> robots, sign-in details,<br />address, TLS, redirect, status,<br />file type and downloaded size<br /><br /><b>Saved output:</b> redacted copy, details<br />and hashes; blocked or failed<br />state retained</p></span></div></fore