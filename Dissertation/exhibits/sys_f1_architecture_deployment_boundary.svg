<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180"
     role="img" aria-labelledby="sys-f1-title sys-f1-desc">
  <title id="sys-f1-title">Local architecture and deployment boundaries</title>
  <desc id="sys-f1-desc">A status-coded architecture diagram shows a loopback browser and command-line interface entering a local FastAPI application. FastAPI serves Jinja and static pages plus a local JSON API, while both entry routes use shared runtime services. The services persist metadata through SQLAlchemy into SQLite managed by Alembic and store raw, source and export artifacts as ignored local files in persistent var storage. A separately gated, optional public research path can perform URL discovery, guarded capture and bounded model extraction, but its live public-company run is unclaimed. Direct Companies House and UKRI live connectors remain held. A final band states that remote exposure, multi-user authentication and tenancy, cloud deployment and autonomous publication are explicit non-goals. The figure is an author synthesis, conceptual and non-empirical.</desc>
