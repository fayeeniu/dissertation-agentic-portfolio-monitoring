  <rect class="page" x="0" y="0" width="900" height="1180"/>
  <text class="title" x="38" y="54">Local architecture and deployment boundaries</text>
  <text class="subtitle" x="40" y="87">One local runtime; status-coded evidence separates tested operation from held claims.</text>
  <rect class="concept" x="714" y="26" width="150" height="34" rx="17"/>
  <text class="concept-text" x="789" y="48">CONCEPTUAL / NO RESULTS</text>
  <line class="divider" x1="38" y1="108" x2="864" y2="108"/>

  <rect class="legend-verified" x="42" y="124" width="190" height="38" rx="9"/>
  <text class="legend-label" x="137" y="148">IMPLEMENTED + LOCAL CHECKS</text>
  <rect class="legend-live" x="248" y="124" width="212" height="38" rx="9"/>
  <text class="legend-label" x="354" y="148">IMPLEMENTED / LIVE UNRUN</text>
  <rect class="legend-held" x="476" y="124" width="166" height="38" rx="9"/>
  <text class="legend-label" x="559" y="148">HELD / GATE CLOSED</text>
  <rect class="legend-nongoal" x="658" y="124" width="202" height="38" rx="9"/>
  <text class="legend-label" x="759" y="148">EXPLICIT NON-GOAL</text>

  <rect class="zone-verified" x="40" y="183" width="820" height="145" rx="14"/>
  <text class="zone-title" x="58" y="209">LOCAL ENTRY AND CONTAINER PROFILE</text>
  <text class="zone-status" x="840" y="209">LOOPBACK / SINGLE USER</text>
  <path class="arrow" d="M 155 294 L 155 362 L 195 362 L 195 405"/>
  <path class="arrow" d="M 355 294 L 355 356 L 510 356 L 510 390"/>
  <path class="arrow" d="M 655 307 L 655 365"/>
  <rect class="box-verified" x="70" y="229" width="170" height="65" rx="10"/>
  <text class="box-title" x="91" y="253">Loopback browser</text>
  <text class="box-small" x="91" y="276">Review and approval UI</text>
  <text class="status-verified" x="91" y="290">LOCAL WEB TESTS</text>
  <rect class="box-verified" x="270" y="229" width="170" height="65" rx="10"/>
  <text class="box-title" x="291" y="253">CLI</text>
  <text class="box-small" x="291" y="276">Import / run / review</text>
  <text class="status-verified" x="291" y="290">SHARED RUNTIME</text>
  <rect class="box" x="485" y="218" width="335" height="89" rx="10"/>
  <text class="box-title-mid" x="505" y="242">Docker Compose local profile</text>
  <text class="box-body" x="505" y="264">127.0.0.1:${PORTFOLIO_PORT:-8000}:8000</text>
  <text class="box-small" x="505" y="283">read-only rootfs; dropped capabilities</text>
  <text class="status-verified" x="505" y="299">IMPLEMENTED / LOCAL RUNTIME VERIFIED</text>

  <rect class="zone-verified" x="40" y="365" width="820" height="284" rx="14"/>
  <text class="zone-title" x="58" y="392">FASTAPI APPLICATION AND SHARED USE-CASE BOUNDARY</text>
  <text class="zone-status" x="840" y="392">IMPLEMENTED + LOCALLY TESTED</text>
  <path class="arrow" d="M 315 477 L 355 477"/>
  <path class="arrow" d="M 585 622 L 330 696 L 245 733"/>
  <path class="arrow" d="M 650 622 L 650 706 L 620 733"/>
  <path class="arrow-live" d="M 780 622 L 780 664"/>
  <rect class="box-verified" x="70" y="405" width="245" height="144" rx="11"/>
  <text class="box-title" x="91" y="434">FastAPI create_app</text>
  <text class="box-body" x="91" y="458">Server-rendered Jinja + static</text>
  <text class="box-body" x="91" y="479">Local JSON API projection</text>
  <text class="box-body" x="91" y="500">Host / client / CSRF controls</text>
  <text class="status-verified" x="91" y="526">NO PRODUCTION AUTH CLAIM</text>
  <rect class="box-verified" x="355" y="405" width="465" height="217" rx="11"/>
  <text class="box-title" x="377" y="433">Runtime services / use cases</text>
  <text class="box-small" x="377" y="453">The browser and CLI call the same service objects and persistence contracts.</text>
  <rect class="service-inner" x="377" y="469" width="198" height="58" rx="8"/>
  <text class="service-head" x="390" y="491">INTAKE + IDENTITY</text>
  <text class="service-body" x="390" y="511">PortfolioImporter / CompanyIntake</text>
  <rect class="service-inner" x="593" y="469" width="205" height="58" rx="8"/>
  <text class="service-head" x="606" y="491">BOUNDED WORKFLOW</text>
  <text class="service-body" x="606" y="511">PortfolioWorkflow / SourceRegistry</text>
  <rect class="service-inner" x="377" y="542" width="198" height="58" rx="8"/>
  <text class="service-head" x="390" y="564">VERIFY + REPORT</text>
  <text class="service-body" x="390" y="584">Independent rules / ReportService</text>
  <rect class="box-live" x="593" y="538" width="205" height="64" rx="8"/>
  <text class="service-head" x="606" y="558">OPTIONAL RESEARCH</text>
  <text class="service-body" x="606" y="578">CompanyResearchService</text>
  <text class="status-live" x="606" y="596">LIVE COMPANY RUN UNCLAIMED</text>

  <rect class="gate" x="455" y="664" width="365" height="50" rx="9"/>
  <text class="gate-head" x="472" y="684">EXTERNAL-PATH GATE</text>
  <text class="gate-body" x="472" y="702">public case + reviewed CH number + both flags + API key + named reviewer</text>

  <rect class="zone-verified" x="40" y="733" width="820" height="143" rx="14"/>
  <text class="zone-title" x="58" y="758">LOCAL PERSISTENCE AND IMMUTABLE ARTIFACT BOUNDARY</text>
  <text class="zone-status" x="840" y="758">IGNORED LOCAL STATE</text>
  <rect class="box-verified" x="70" y="775" width="330" height="73" rx="10"/>
  <text class="box-title-mid" x="90" y="800">SQLAlchemy sessions -> SQLite</text>
  <text class="box-body" x="90" y="822">Alembic upgrade to head; FK + audit/version state</text>
  <text class="status-verified" x="90" y="840">SCHEMA EQUIVALENCE TESTED</text>
  <rect class="box-verified" x="430" y="775" width="390" height="73" rx="10"/>
  <text class="box-title-mid" x="450" y="800">Create-once evidence and report artifacts</text>
  <text class="box-body" x="450" y="822">var/raw + var/sources + var/exports; hashes and manifests</text>
  <text class="status-verified" x="450" y="840">LOCAL INTEGRITY / APPROVAL TESTS</text>
  <rect class="volume" x="266" y="851" width="368" height="27" rx="8"/>
  <text class="volume-text" x="450" y="870">COMPOSE VOLUME: portfolio-state -> /app/var (persistent local state)</text>

  <path class="arrow-live" d="M 780 714 L 840 714 L 840 900 L 180 900 L 180 925"/>
  <rect class="zone-live" x="40" y="900" width="820" height="160" rx="14"/>
  <text class="zone-title" x="58" y="924">OPTIONAL UNTRUSTED PUBLIC / EXTERNAL PROVIDER BOUNDARY</text>
  <text class="zone-status" x="840" y="924">IMPLEMENTED CONTROLS / LIVE UNRUN</text>
  <path class="arrow-live" d="M 286 978 L 315 978"/>
  <rect class="box-live" x="70" y="942" width="216" height="75" rx="10"/>
  <text class="box-title-mid" x="88" y="966">URL discovery candidates</text>
  <text class="box-small" x="88" y="986">OpenAI Responses web search</text>
  <text class="status-live" x="88" y="1006">DISCOVERY IS NOT EVIDENCE</text>
  <rect class="box-live" x="315" y="942" width="310" height="75" rx="10"/>
  <text class="box-title-mid" x="333" y="966">Guarded HTTPS capture + optional model</text>
  <text class="box-small" x="333" y="986">public only; store=False; exact-span validation</text>
  <text class="status-live" x="333" y="1006">FAKE / ADVERSARIAL PATH TESTED; LIVE UNRUN</text>
  <rect class="box-held" x="654" y="942" width="166" height="75" rx="10"/>
  <text class="box-title-mid" x="672" y="966">Direct registry APIs</text>
  <text class="box-small" x="672" y="986">Companies House / UKRI</text>
  <text class="status-held" x="672" y="1006">G2 HELD</text>
  <rect class="return" x="116" y="1025" width="668" height="27" rx="8"/>
  <text class="return-text" x="450" y="1044">Return admitted bytes and exact spans only; snippets or free-form model prose cannot support claims.</text>

  <rect class="nongoal" x="40" y="1077" width="820" height="51" rx="10"/>
  <text class="nongoal-head" x="58" y="1099">EXPLICIT NON-GOAL / STOP:</text>
  <text class="nongoal-body" x="246" y="1099">remote exposure; multi-user auth/tenancy; cloud deployment; autonomous publication;</text>
  <text class="nongoal-body" x="246" y="1118">production-security assurance; or a claim that live public-company calls were completed.</text>

  <text class="source" x="40" y="1150">Source note: author synthesis of repository architecture, ADRs, code and local tests; conceptual and non-empirical.</text>
  <text class="source" x="40" y="1168">Design context: NIST AI RMF (2023), PDF pp. 20-23, 33-35; Greshake et al. (2023), pp. 1, 3-5; Pineau et al. (2021), pp. 1-4. Full locators/hashes in provenance.</text>
</svg>
