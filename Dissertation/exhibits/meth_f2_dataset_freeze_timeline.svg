      .seal-badge { fill:#FFFFFF; stroke:#B23A48; stroke-width:1.4; }
      .seal-text { font:700 12px Helvetica,Arial,sans-serif; fill:#8E2736; text-anchor:middle; }
      .condition { fill:#FFFFFF; stroke:#65988E; stroke-width:1.2; }
      .condition-held { fill:#FFF5E8; stroke:#B06816; stroke-width:1.4; }
      .condition-text { font:700 11.5px Helvetica,Arial,sans-serif; fill:#285B53; text-anchor:middle; }
      .condition-held-text { font:700 11px Helvetica,Arial,sans-serif; fill:#86500C; text-anchor:middle; }
      .step-kicker { font:700 12px Helvetica,Arial,sans-serif; fill:#536B78; }
      .step-title { font:700 18px Helvetica,Arial,sans-serif; fill:#173F51; }
