<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280"
     role="img" aria-labelledby="meth-f2-title meth-f2-desc">
  <title id="meth-f2-title">Dataset tiers and freeze timeline</title>
  <desc id="meth-f2-desc">A portrait methodology timeline. D0 synthetic visible adversarial engineering fixtures and a separately authorised D1 pilot may inform one versioned freeze of the catalogue, rules, schemas, prompts, code and analysis plan. D2 remains a sealed final company-period out-of-sample holdout until an approved opening after the freeze. Only then may comparable C0 to C3 execution occur, followed by adjudication against the frozen reference and bounded analysis. Explicit callouts state that D0 is mechanism evidence rather than real-world performance, D1 is pilot evidence rather than confirmatory evidence unless pre-declared exploratory, participant observations belong to authorised C0 and C3 execution rather than a fourth dataset tier, and any D2-informed post-access change makes the run exploratory. Current D2 and C0 or C3 held states are visible. The figure is conceptual and contains no result values, sample sizes or thresholds.</desc>
  <defs>
    <style><![CDATA[
      .page { fill:#FFFFFF; }
      .divider { stroke:#9FB2BD; stroke-width:1.5; }
      .title { font:700 34px Helvetica,Arial,sans-serif; fill:#173444; }
      .subtitle { font:18px Helvetica,Arial,sans-serif; fill:#526875; }
      .badgebox { fill:#EAF3F8; stroke:#7C99AA; stroke-width:1.5; }
      .badge { font:700 13px Helvetica,Arial,sans-serif; fill:#355466; text-anchor:middle; }
      .d0-card { fill:#EAF3F8; stroke:#0072B2; stroke-width:2.2; }
      .d1-card { fill:#E8F4F2; stroke:#007F73; stroke-width:2.2; }
      .freeze-card { fill:#F3F6F7; stroke:#4E6B79; stroke-width:2.4; }
      .d2-card { fill:#FBEAEC; stroke:#B23A48; stroke-width:3; }
      .run-card { fill:#EEF5F1; stroke:#2D7D5F; stroke-width:2.4; }
      .result-card { fill:#F4F6F7; stroke:#647C88; stroke-width:1.8; }
      .warning-card { fill:#FFF5E8; stroke:#B06816; stroke-width:2; }
