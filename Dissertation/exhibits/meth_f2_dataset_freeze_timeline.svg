      .danger-title { font:700 13px Helvetica,Arial,sans-serif; fill:#8E2736; }
      .callout-body { font:12px Helvetica,Arial,sans-serif; fill:#4E4B46; }
      .arrow-line { fill:none; stroke:#617684; stroke-width:2.3; }
      .arrow-head { fill:#617684; stroke:none; }
