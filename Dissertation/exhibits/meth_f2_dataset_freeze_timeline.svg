      .tag-d1 { fill:#007F73; stroke:#00665C; stroke-width:1; }
      .tag-freeze { fill:#4E6B79; stroke:#38515D; stroke-width:1; }
      .tag-d2 { fill:#B23A48; stroke:#8E2736; stroke-width:1; }
      .tag-run { fill:#2D7D5F; stroke:#236348; stroke-width:1; }
      .tag-text { font:700 12px Helvetica,Arial,sans-serif; fill:#FFFFFF; text-anchor:middle; }
      .card-title { font:700 19px Helvetica,Arial,sans-serif; fill:#173F51; }
      .card-body { font:13px Helvetica,Arial,sans-serif; fill:#405965; }
      .card-body-strong { font:700 13px Helvetica,Arial,sans-serif; fill:#314D5C; }
      .center-title { font:700 22px Helvetica,Arial,sans-serif; fill:#173F51; text-anchor:middle; }
      .center-body { font:13.5px Helvetica,Arial,sans-serif; fill:#405965; text-anchor:middle; }
