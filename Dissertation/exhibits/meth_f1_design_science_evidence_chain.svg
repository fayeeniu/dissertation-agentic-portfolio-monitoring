<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280"
     role="img" aria-labelledby="meth-f1-title meth-f1-desc">
  <title id="meth-f1-title">Design-science evidence chain with a non-leap boundary</title>
  <desc id="meth-f1-desc">A vertical seven-stage chain runs from problem and objectives through a frozen research contract, artefact build, implementation and engineering evidence, frozen C0 to C3 protocol execution, empirical findings, and proportionate research-question communication. A prominent non-leap gate states that implementation evidence cannot become an empirical finding without protocol execution. A left rail makes researcher involvement visible across framing, building, evaluation and interpretation. A right rail shows mitigation controls: freezing, versioned evidence, independent or adjudicated labels or review, and narrow claim limits. The figure is conceptual and contains no empirical result values.</desc>
  <defs>
    <style><![CDATA[
      .page { fill:#FFFFFF; }
      .divider { stroke:#9FB2BD; stroke-width:1.5; }
      .title { font:700 34px Helvetica,Arial,sans-serif; fill:#173444; }
      .subtitle { font:18px Helvetica,Arial,sans-serif; fill:#526875; }
      .badgebox { fill:#EAF3F8; stroke:#7C99AA; stroke-width:1.5; }
      .badge { font:700 13px Helvetica,Arial,sans-serif; fill:#355466; text-anchor:middle; }
      .rail { fill:#F4F6F7; stroke:#8DA2AE; stroke-width:1.8; }
      .rail-head { font:700 13px Helvetica,Arial,sans-serif; fill:#314E5D; text-anchor:middle; }
      .rail-sub { font:11.5px Helvetica,Arial,sans-serif; fill:#647782; text-anchor:middle; }
      .research-box { fill:#FFFFFF; stroke:#617A88; stroke-width:1.4; }
      .control-box { fill:#FFFFFF; stroke:#486B79; stroke-width:1.4; }
      .side-title { font:700 12.5px Helvetica,Arial,sans-serif; fill:#274757; }
      .side-text { font:11.5px Helvetica,Arial,sans-serif; fill:#415965; }
      .side-note { font:11px Helvetica,Arial,sans-serif; fill:#5A6C75; text-anchor:middle; }
      .stage-design { fill:#EAF3F8; stroke:#0072B2; stroke-width:2.2; }
      .stage-eval { fill:#E8F4F2; stroke:#007F73; stroke-width:2.2; }
      .stage-report { fill:#EEF5F1; stroke:#2D7D5F; stroke-width:2.2; }
      .number-design { fill:#0072B2; stroke:#005C90; stroke-width:1.2; }
      .number-eval { fill:#007F73; stroke:#00665C; stroke-width:1.2; }
      .number-report { fill:#2D7D5F; stroke:#236348; stroke-width:1.2; }
      .number { font:700 20px Helvetica,Arial,sans-serif; fill:#FFFFFF; text-anchor:middle; }
      .stage-kicker { font:700 12px Helvetica,Arial,sans-serif; fill:#536B78; }
      .stage-title { font:700 19px Helvetica,Arial,sans-serif; fill:#173F51; }
      .stage-body { font:13px Helvetica,Arial,sans-serif; fill:#405965; }
      .arrow { fill:none; stroke:#617684; stroke-width:2.3; marker-end:url(#arrowhead); }
      .connector { stroke:#8AA0AB; stroke-width:1.4; }
      .gate { fill:#FBEAEC; stroke:#B23A48; stroke-width:3; }
      .gate-label { font:700 15px Helvetica,Arial,sans-serif; fill:#8E2736; text-anchor:middle; }
      .gate-title { font:700 18px Helvetica,Arial,sans-serif; fill:#6E2030; text-anchor:middle; }
      .gate-body { font:13.5px Helvetica,Arial,sans-serif; fill:#4C3940; text-anchor:middle; }
      .condition { fill:#FFFFFF; stroke:#65988E; stroke-width:1.1; }
      .condition-text { font:700 11px Helvetica,Arial,sans-serif; fill:#285B53; text-anchor:middle; }
      .legend { fill:#F3F7F9; stroke:#75909F; stroke-width:1.5; }
      .legend-title { font:700 13px Helvetica,Arial,sans-serif; fill:#355668; }
      .legend-text { font:12px Helvetica,Arial,sans-serif; fill:#536A76; }
