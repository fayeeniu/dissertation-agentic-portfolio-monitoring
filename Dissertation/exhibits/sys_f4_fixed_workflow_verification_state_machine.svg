<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180"
     role="img" aria-labelledby="sys-f4-title sys-f4-desc">
  <title id="sys-f4-title">Fixed workflow and verification state machine</title>
  <desc id="sys-f4-desc">Author-synthesised, non-empirical state diagram for the local evidence-first portfolio workflow. A fixed sequence moves from validated plan and intake through typed extraction, normalisation, source and evidence eligibility review, typed claim construction, and a separate independent verifier. The verifier writes one of five explicit states: supported, contradicted, insufficient evidence, stale, or rejected untrusted. Only supported claims enter the supported narrative; every other state remains visible as an exception or hold. WorkflowRun and AgentRun records retain stage, role, status, hashes, attempts, timings, contract versions and errors. Fail-closed preconditions and explicit termination prevent open-ended agents. Deterministic report assembly leads to a named human review gate, approval of the current version and persisted content hash, and manifest-backed JSON, Markdown and HTML export. Editing creates a new section and report version, changes the content hash, clears approval and returns the report to review. The implementation and local engineering tests do not establish source truth, autonomous publication, human-review benefit, production safety or empirical performance.</desc>
  <defs>
    <style><![CDATA[
      .title { font: 700 29px Helvetica, Arial, sans-serif; fill: #17384a; }
      .subtitle { font: 16px Helvetica, Arial, sans-serif; fill: #526b79; }
      .badge { fill: #eef4f6; stroke: #7892a0; stroke-width: 1.5; }
      .badge-text { font: 700 10px Helvetica, Arial, sans-serif; fill: #355567; text-anchor: middle; }
      .legend-tested { fill: #e9f4f8; stroke: #0072b2; stroke-width: 2; }
      .legend-protocol { fill: #fff5dd; stroke: #b66f00; stroke-width: 2; stroke-dasharray: 9 6; }
      .legend-stop { fill: #fff0f1; stroke: #b53a48; stroke-width: 2; stroke-dasharray: 2 6; }
      .legend-text { font: 700 11px Helvetica, Arial, sans-serif; fill: #355567; text-anchor: middle; }
      .rule { stroke: #9ab0bc; stroke-width: 1.2; }
      .zone { fill: #f8fbfc; stroke: #0072b2; stroke-width: 2; }
      .zone-title { font: 700 14px Helvetica, Arial, sans-serif; fill: #284b5e; }
      .zone-status { font: 700 10px Helvetica, Arial, sans-serif; fill: #607783; text-anchor: end; }
      .box-tested { fill: #e9f4f8; stroke: #0072b2; stroke-width: 2; }
      .box-neutral { fill: #ffffff; stroke: #718894; stroke-width: 1.6; }
      .box-protocol { fill: #fff5dd; stroke: #b66f00; stroke-width: 1.8; stroke-dasharray: 8 5; }
      .box-stop { fill: #fff0f1; stroke: #b53a48; stroke-width: 1.8; }
      .box-title { font: 700 13px Helvetica, Arial, sans-serif; fill: #173f53; }
      .box-body { font: 10.5px Helvetica, Arial, sans-serif; fill: #496472; }
      .box-small { font: 9.6px Helvetica, Arial, sans-serif; fill: #4d6674; }
      .status-tested { font: 700 9.5px Helvetica, Arial, sans-serif; fill: #006a9f; }
      .status-protocol { font: 700 9.5px Helvetica, Arial, sans-serif; fill: #945900; }
      .status-stop { font: 700 9.5px Helvetica, Arial, sans-serif; fill: #a33240; }
      .control { fill: #edf2f4; stroke: #6e8490; stroke-width: 1.5; stroke-dasharray: 12 5 2 5; }
      .control-title { font: 700 11.5px Helvetica, Arial, sans-serif; fill: #355566; }
      .control-body { font: 10px Helvetica, Arial, sans-serif; fill: #4d6674; }
      .guard { fill: #fff8e8; stroke: #b66f00; stroke-width: 1.5; stroke-dasharray: 7 4; }
      .guard-text { font: 700 10px Helvetica, Arial, sans-serif; fill: #7b4b00; text-anchor: middle; }
      .stop-strip { fill: #fff0f1; stroke: #b53a48; stroke-width: 1.5; }
      .stop-text { font: 700 9.7px Helvetica, Arial, sans-serif; fill: #9f3340; text-anchor: middle; }
      .out-supported { fill: #e9f4f8; stroke: #0072b2; stroke-width: 1.7; }
      .out-hold { fill: #fff0f1; stroke: #b53a48; stroke-width: 1.5; }
      .out-neutral { fill: #f2f5f6; stroke: #6f838e; stroke-width: 1.5; }
      .out-text { font: 700 10px Helvetica, Arial, sans-serif; fill: #284b5e; text-anchor: middle; }
      .arrow { fill: none; stroke: #617684; stroke-width: 2; marker-end: url(#arrowhead); }
      .arrow-tested { fill: none; stroke: #0072b2; stroke-width: 2; marker-end: url(#arrowhead-blue); }
      .arrow-stop { fill: none; stroke: #b53a48; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#arrowhead-red); }
      .source { font: 9px Helvetica, Arial, sans-serif; fill: #5c717d; }
      .nongoal { fill: #f2f5f6; stroke: #6f838e; stroke-width: 1.5; stroke-dasharray: 12 5 2 5; }
      .nongoal-head { font: 700 10px Helvetica, Arial, sans-serif; fill: #3b5665; }
      .nongoal-body { font: 9.5px Helvetica, Arial, sans-serif; fill: #4e6673; }
    ]]></style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#617684"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#0072b2"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#b53a48"/>
    </marker>
  </defs>

  <text class="title" x="40" y="48">Fixed workflow and verification state machine</text>
  <text class="subtitle" x="42" y="79">Bounded roles produce auditable records; only named review can authorise controlled export.</text>
  <rect class="badge" x="708" y="24" width="152" height="31" rx="15"/>
  <text class="badge-text" x="784" y="44">CONCEPTUAL / NO RESULTS</text>
  <line class="rule" x1="40" y1="99" x2="860" y2="99"/>

  <rect class="legend-tested" x="45" y="115" width="252" height="37" rx="9"/>
  <text class="legend-text" x="171" y="138">IMPLEMENTED + LOCAL TESTS</text>
  <rect class="legend-protocol" x="324" y="115" width="252" height="37" rx="9"/>
  <text class="legend-text" x="450" y="138">EVALUATION / HUMAN OUTCOMES UNRUN</text>
  <rect class="legend-stop" x="603" y="115" width="252" height="37" rx="9"/>
  <text class="legend-text" x="729" y="138">FAIL CLOSED / RETAIN STATE</text>

  <rect class="zone" x="40" y="170" width="820" height="375" rx="14"/>
  <text class="zone-title" x="58" y="199">1  FIXED, TYPED EXECUTION PATH</text>
  <text class="zone-status" x="842" y="199">SERIAL / EXPLICIT TERMINATION</text>

  <path class="arrow" d="M 205 266 L 218 266"/>
  <path class="arrow" d="M 348 266 L 361 266"/>
  <path class="arrow" d="M 511 266 L 524 266"/>
  <path class="arrow" d="M 679 266 L 692 266"/>

  <rect class="box-tested" x="55" y="222" width="150" height="88" rx="9"/>
  <text class="box-title" x="70" y="245">Plan + intake</text>
  <text class="box-body" x="70" y="265">period / cutoff / class</text>
  <text class="box-body" x="70" y="282">identity and source gates</text>
  <text class="status-tested" x="70" y="302">PRECONDITIONS FIRST</text>

  <rect class="box-tested" x="218" y="222" width="130" height="88" rx="9"/>
  <text class="box-title" x="233" y="245">Extract</text>
  <text class="box-body" x="233" y="265">strict typed schema</text>
  <text class="box-body" x="233" y="282">exact value or abstain</text>
  <text class="status-tested" x="233" y="302">NO FREE TEXT FACTS</text>

  <rect class="box-tested" x="361" y="222" width="150" height="88" rx="9"/>
  <text class="box-title" x="376" y="245">Normalise</text>
  <text class="box-body" x="376" y="265">value / missing state</text>
  <text class="box-body" x="376" y="282">unit / currency / period</text>
  <text class="status-tested" x="376" y="302">NO SILENT REPAIR</text>

  <rect class="box-tested" x="524" y="222" width="155" height="88" rx="9"/>
  <text class="box-title" x="539" y="245">Evidence review</text>
  <text class="box-body" x="539" y="265">admission + locator</text>
  <text class="box-body" x="539" y="282">time + provenance state</text>
  <text class="status-tested" x="539" y="302">INELIGIBLE IS HELD</text>

  <rect class="box-tested" x="692" y="222" width="153" height="88" rx="9"/>
  <text class="box-title" x="707" y="245">Claim build</text>
  <text class="box-body" x="707" y="265">typed proposition</text>
  <text class="box-body" x="707" y="282">evidence links retained</text>
  <text class="status-tested" x="707" y="302">CANDIDATE, NOT TRUTH</text>

  <rect class="control" x="55" y="330" width="790" height="72" rx="9"/>
  <text class="control-title" x="72" y="352">Persisted stage/run records</text>
  <text class="control-body" x="72" y="371">WorkflowRun: stage, status, cutoff, evidence/quality contract versions, start/end/error.</text>
  <text class="control-body" x="72" y="388">AgentRun: role, stage, status, input/output hashes, attempts, timings, provider/model metadata and error.</text>
  <text class="status-tested" x="825" y="352" text-anchor="end">TYPED AUDIT, NOT HIDDEN REASONING</text>

  <rect class="box-stop" x="55" y="420" width="245" height="92" rx="9"/>
  <text class="box-title" x="70" y="443">Fail-closed preconditions</text>
  <text class="box-small" x="70" y="463">unknown dataset / ambiguous identity /</text>
  <text class="box-small" x="70" y="479">missing cutoff or unadmitted source</text>
  <text class="status-stop" x="70" y="501">STOP BEFORE DOWNSTREAM WORK</text>

  <rect class="box-stop" x="327" y="420" width="245" height="92" rx="9"/>
  <text class="box-title" x="342" y="443">Validation stop</text>
  <text class="box-small" x="342" y="463">untrusted instructions / schema mismatch /</text>
  <text class="box-small" x="342" y="479">period, value, unit or currency conflict</text>
  <text class="status-stop" x="342" y="501">ABSTAIN, CONTRADICT OR HOLD</text>

  <rect class="box-neutral" x="599" y="420" width="246" height="92" rx="9"/>
  <text class="box-title" x="614" y="443">Retry + idempotency boundary</text>
  <text class="box-small" x="614" y="463">path-specific bounded attempts only;</text>
  <text class="box-small" x="614" y="479">failed stage recorded; verified reuse where defined</text>
  <text class="status-tested" x="614" y="501">NO OPEN-ENDED AGENT LOOP</text>

  <path class="arrow-tested" d="M 845 266 L 872 266 L 872 552 L 180 552 L 180 634"/>
  <rect class="zone" x="40" y="570" width="820" height="267" rx="14"/>
  <text class="zone-title" x="58" y="599">2  INDEPENDENT VERIFICATION AND EXPLICIT OUTCOMES</text>
  <text class="zone-status" x="842" y="599">IMPLEMENTED + LOCALLY TESTED</text>

  <rect class="box-tested" x="55" y="634" width="250" height="104" rx="10"/>
  <text class="box-title" x="72" y="658">Independent verifier</text>
  <text class="box-body" x="72" y="678">separate role checks exact value, period,</text>
  <text class="box-body" x="72" y="695">sourceability, provenance and conflict</text>
  <text class="box-small" x="72" y="714">writes Verification status + rationale;</text>
  <text class="status-tested" x="72" y="731">DOES NOT REWRITE CLAIM OR EVIDENCE</text>
  <path class="arrow" d="M 305 686 L 337 686"/>

  <rect class="out-supported" x="337" y="634" width="148" height="45" rx="8"/>
  <text class="out-text" x="411" y="661">SUPPORTED</text>
  <rect class="out-hold" x="500" y="634" width="148" height="45" rx="8"/>
  <text class="out-text" x="574" y="661">CONTRADICTED</text>
  <rect class="out-neutral" x="663" y="634" width="167" height="45" rx="8"/>
  <text class="out-text" x="746" y="655">INSUFFICIENT</text>
  <text class="out-text" x="746" y="669">EVIDENCE</text>
  <rect class="out-neutral" x="420" y="697" width="148" height="45" rx="8"/>
  <text class="out-text" x="494" y="724">STALE</text>
  <rect class="out-hold" x="585" y="697" width="195" height="45" rx="8"/>
  <text class="out-text" x="682" y="717">REJECTED</text>
  <text class="out-text" x="682" y="731">UNTRUSTED</text>

  <rect class="guard" x="70" y="766" width="760" height="48" rx="8"/>
  <text class="guard-text" x="450" y="786">ONLY SUPPORTED CLAIMS ENTER THE SUPPORTED NARRATIVE; EVERY OTHER STATE REMAINS AN EXCEPTION OR HOLD.</text>
  <text class="guard-text" x="450" y="802">A LOCATOR, CHECKSUM OR CITATION SUPPORTS TRACEABILITY - IT DOES NOT ESTABLISH SOURCE TRUTH.</text>

  <rect class="zone" x="40" y="860" width="820" height="233" rx="14"/>
  <text class="zone-title" x="58" y="889">3  REPORT, HUMAN AUTHORITY AND CONTROLLED EXPORT</text>
  <text class="zone-status" x="842" y="889">NO AUTONOMOUS PUBLICATION</text>

  <path class="arrow" d="M 240 955 L 257 955"/>
  <path class="arrow" d="M 435 955 L 452 955"/>
  <path class="arrow" d="M 647 955 L 664 955"/>
  <rect class="box-tested" x="55" y="914" width="185" height="82" rx="9"/>
  <text class="box-title" x="70" y="938">Report assembly</text>
  <text class="box-body" x="70" y="958">deterministic sections</text>
  <text class="box-body" x="70" y="975">supported narrative + exceptions</text>
  <text class="status-tested" x="70" y="989">PENDING_REVIEW</text>

  <rect class="box-tested" x="257" y="914" width="178" height="82" rx="9"/>
  <text class="box-title" x="272" y="938">Named human review</text>
  <text class="box-body" x="272" y="958">approve / reject / request edit</text>
  <text class="box-small" x="272" y="975">actor + reason + report version</text>
  <text class="status-protocol" x="272" y="989">HUMAN BENEFIT UNMEASURED</text>

  <rect class="box-tested" x="452" y="914" width="195" height="82" rx="9"/>
  <text class="box-title" x="467" y="938">Current-version approval</text>
  <text class="box-body" x="467" y="958">all claims have verifier records</text>
  <text class="box-small" x="467" y="975">version + persisted content hash</text>
  <text class="status-tested" x="467" y="989">OPTIMISTIC LOCK REQUIRED</text>

  <rect class="box-tested" x="664" y="914" width="181" height="82" rx="9"/>
  <text class="box-title" x="679" y="938">Controlled export</text>
  <text class="box-body" x="679" y="958">JSON / Markdown / HTML</text>
  <text class="box-small" x="679" y="975">pending manifest -> atomic final</text>
  <text class="status-tested" x="679" y="989">HASHES REVERIFIED</text>

  <rect class="stop-strip" x="158" y="1020" width="630" height="48" rx="8"/>
  <text class="stop-text" x="473" y="1040">EDIT -> NEW SECTION + REPORT VERSION, NEW CONTENT HASH, APPROVAL CLEARED</text>
  <text class="stop-text" x="473" y="1056">RETURN TO NAMED REVIEW; STALE MUTATIONS AND EXPORTS FAIL CLOSED</text>
  <path class="arrow-stop" d="M 474 1020 L 474 1007 L 346 1007 L 346 997"/>

  <rect class="nongoal" x="40" y="1105" width="820" height="36" rx="8"/>
  <text class="nongoal-head" x="58" y="1128">BOUNDARY:</text>
  <text class="nongoal-body" x="126" y="1128">no guaranteed truth, unconstrained agents, autonomous publication, production safety or measured reviewer benefit.</text>

  <text class="source" x="40" y="1157">Source note: author synthesis of stable repository workflow, verifier, report, approval/export and local-test contracts; conceptual and non-empirical.</text>
  <text class="source" x="40" y="1174">Design context: Gao et al. (2023a), PDF pp. 3-4, 10; NIST AI RMF (2023), pp. 33-35; Amershi et al. (2019), pp. 3-5.</text>
</svg>
